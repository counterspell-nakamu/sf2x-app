<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スパ2X 16キャラ戦 チーム管理＆OBSツール</title>
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
  :root {
    --bg-color: #0f0f13;
    --panel-bg: #1a1a24;
    --card-bg: #252533;
    --text-color: #ffffff;
  }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    margin: 0;
    padding: 10px;
  }

  h2, h3 { margin: 5px 0 10px 0; }

  .admin-panel {
    background: var(--panel-bg);
    border: 1px solid #333;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 20px;
  }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

  textarea, select, input[type="text"] {
    background: #101015;
    color: #fff;
    border: 1px solid #444;
    padding: 6px;
    border-radius: 4px;
    box-sizing: border-box;
  }

  .btn {
    background: #3a86ff;
    color: white;
    border: none;
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
  }
  .btn:hover { background: #2563eb; }
  .btn-danger { background: #d90429; }
  .btn-success { background: #38b000; }
  .btn-warning { background: #ff9f1c; color: #000; }

  .mode-select {
    background: #111118;
    padding: 8px;
    border-radius: 6px;
    margin-bottom: 8px;
    font-size: 0.9em;
  }

  .member-checklist {
    background: #101015;
    border: 1px solid #444;
    border-radius: 4px;
    padding: 8px;
    max-height: 140px;
    overflow-y: auto;
    margin-bottom: 8px;
  }

  .member-item {
    display: inline-flex;
    align-items: center;
    background: #20202c;
    border: 1px solid #333;
    padding: 3px 8px;
    border-radius: 4px;
    margin-right: 6px;
    margin-bottom: 6px;
  }

  .btn-del {
    background: transparent;
    color: #ff5555;
    border: none;
    font-weight: bold;
    cursor: pointer;
    font-size: 1.1em;
    padding: 0 2px;
  }

  .obs-display { display: flex; gap: 10px; }

  .team-column {
    background: var(--panel-bg);
    border-radius: 8px;
    padding: 8px;
    width: 170px;
    box-sizing: border-box;
  }

  .team-title {
    text-align: center;
    font-size: 1.1em;
    font-weight: bold;
    padding: 4px;
    border-radius: 4px;
    margin-bottom: 8px;
  }
  .p1-header { background: #8d0801; }
  .p2-header { background: #1d3557; }

  .player-card {
    display: flex;
    align-items: center;
    background: var(--card-bg);
    margin-bottom: 4px;
    padding: 4px 6px;
    border-radius: 4px;
    gap: 6px;
    cursor: pointer;
    user-select: none;
    width: 100%;
    box-sizing: border-box;
    height: 42px;
  }
  .player-card:hover { background: #323246; }

  .order-num { font-weight: bold; width: 20px; color: #aaa; text-align: right; font-size: 0.9em; flex-shrink: 0; }
  
  .char-face { 
    width: 32px; 
    height: 32px; 
    object-fit: cover; 
    border-radius: 3px; 
    background: #000; 
    flex-shrink: 0;
  }
  /* 2P側の顔画像を自動で左右反転するスタイル */
  .p2-face {
    transform: scaleX(-1);
  }
  .char-face.load-error { display: none; }

  .player-info { flex: 1; overflow: hidden; min-width: 0; }
  .player-name { 
    font-size: 0.9em; 
    font-weight: bold; 
    white-space: nowrap; 
    overflow: hidden; 
    text-overflow: ellipsis; 
  }
  .char-name { font-size: 0.7em; color: #bbb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .is-hidden .player-name { color: #666; }
  .is-hidden .char-name { color: #444; }

  .modal {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.8);
    justify-content: center;
    align-items: center;
    z-index: 100;
  }
  .modal-content {
    background: var(--panel-bg);
    padding: 20px;
    border-radius: 8px;
    max-width: 800px;
    width: 90%;
    max-height: 85vh;
    overflow-y: auto;
  }

  .order-row {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 6px;
  }
</style>
</head>
<body>

  <div class="admin-panel">
    <details open>
      <summary>⚙️ 管理操作パネル</summary>
      <div style="margin-top: 10px;">
        
        <div class="mode-select" style="background:#20202d; margin-bottom:12px;">
          <b>📱 端末別入力モード設定:</b><br>
          <label><input type="radio" name="deviceRole" value="pc_all" checked onclick="setDeviceRole('pc_all')"> 💻 PC1台で両チーム分を入力する</label><br>
          <label><input type="radio" name="deviceRole" value="p1_only" onclick="setDeviceRole('p1_only')"> 🔴 この端末は 1Pチームのみ 操作＆閲覧</label><br>
          <label><input type="radio" name="deviceRole" value="p2_only" onclick="setDeviceRole('p2_only')"> 🔵 この端末は 2Pチームのみ 操作＆閲覧</label>
        </div>

        <div class="grid-2">
          <div>
            <h3>1. プレイヤー選択（本日の参加者）</h3>
            <div id="masterChecklist" class="member-checklist"></div>
            
            <div style="display:flex; gap:5px; margin-bottom:10px;">
              <input type="text" id="newPlayerInput" placeholder="新しいプレイヤー名を追加" style="flex:1;">
              <button class="btn" onclick="addNewPlayer()">名簿に追加</button>
            </div>

            <button class="btn btn-success" style="width:100%;" onclick="makeRandomTeams()">チェックした人を1P / 2Pチームに自動振り分け</button>
          </div>

          <div>
            <h3>2. オーダー＆キャラ設定 (16枠)</h3>
            <div class="mode-select">
              <label><input type="radio" name="orderMode" value="manual" checked> 手動設定（完全自由）</label><br>
              <label><input type="radio" name="orderMode" value="bossFixed"> 1〜15人目シャッフル ＋ 大将(16人目)固定</label>
            </div>
            <div style="display:flex; flex-direction:column; gap:10px;">
              <button id="btnOpenP1" class="btn btn-success" onclick="openOrderModal('1')">🔴 1Pチーム オーダー設定</button>
              <button id="btnOpenP2" class="btn btn-success" onclick="openOrderModal('2')">🔵 2Pチーム オーダー設定</button>
            </div>
          </div>
        </div>

      </div>
    </details>
  </div>

  <div class="obs-display">
    <div class="team-column">
      <div class="team-title p1-header">1P TEAM</div>
      <div id="team1-display"></div>
    </div>

    <div class="team-column">
      <div class="team-title p2-header">2P TEAM</div>
      <div id="team2-display"></div>
    </div>
  </div>

  <div id="orderModal" class="modal">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <h3 id="modalTitle" style="margin:0;">オーダー設定 (16枠)</h3>
        <button class="btn btn-warning" onclick="saveAndShuffleModal()">🔀 完了して裏でランダムシャッフル</button>
      </div>
      <div id="modalOrderRows"></div>
      <br>
      <div style="display:flex; gap:10px; justify-content:flex-end;">
        <button class="btn btn-success" onclick="saveOrderModal()">そのまま設定完了</button>
        <button class="btn btn-danger" onclick="closeOrderModal()">キャンセル</button>
      </div>
    </div>
  </div>

<script>
// --- Firebase初期設定 ---
const firebaseConfig = {
  apiKey: "AIzaSyDMgiXpRGBLJofwxWEh0pG5b3FQ7yZNLK8",
  authDomain: "sf2x-app.firebaseapp.com",
  projectId: "sf2x-app",
  storageBucket: "sf2x-app.firebasestorage.app",
  messagingSenderId: "447610198262",
  appId: "1:447610198262:web:1a9576f2d6696518caf4d7",
  measurementId: "G-141DL20YTK"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// キャラ順を変更（フェイロンとキャミィを実際の選択画面並びに合わせて入れ替え）
const baseChars = ["リュウ","ケン","本田","春麗","ブランカ","ザンギエフ","ガイル","ダルシム","ホーク","キャミィ","フェイロン","ディージェイ","バイソン","バルログ","サガット","ベガ"];
const allCharacters = baseChars.map((name, i) => ({
  id: `x_${i}`, name: `X ${name}`, icon: `image/x_${i}.png`
}));

let appState = {
  masterPlayers: ["ウメハラ", "ヌキ", "ハイタニ", "サコー", "ナカム～", "ぐっち", "こたか", "サシシ"],
  team1Members: [],
  team2Members: [],
  team1Orders: create16OrdersEmpty(),
  team2Orders: create16OrdersEmpty(),
  isOrderSet: false
};

let currentRole = 'pc_all';
let currentModalTeam = '1';

window.onload = function() {
  db.ref('sf2x_state').on('value', (snapshot) => {
    const data = snapshot.val();
    if (data) {
      appState = data;
      renderMasterChecklist();
      renderDisplay();
    } else {
      syncToFirebase();
    }
  });
};

function syncToFirebase() {
  db.ref('sf2x_state').set(appState);
}

function setDeviceRole(role) {
  currentRole = role;
  const btnP1 = document.getElementById("btnOpenP1");
  const btnP2 = document.getElementById("btnOpenP2");

  if (role === 'p1_only') {
    btnP1.style.display = "block";
    btnP2.style.display = "none";
  } else if (role === 'p2_only') {
    btnP1.style.display = "none";
    btnP2.style.display = "block";
  } else {
    btnP1.style.display = "block";
    btnP2.style.display = "block";
  }
}

function create16OrdersEmpty() {
  let orders = [];
  for (let i = 0; i < 16; i++) {
    orders.push({ name: "", charId: "", revealed: false });
  }
  return orders;
}

function renderMasterChecklist() {
  const container = document.getElementById("masterChecklist");
  if (!container) return;
  container.innerHTML = "";
  if (!appState.masterPlayers) appState.masterPlayers = [];
  
  appState.masterPlayers.forEach((p, idx) => {
    const item = document.createElement("div");
    item.className = "member-item";
    item.innerHTML = `
      <label><input type="checkbox" class="player-chk" value="${escapeHTML(p)}" checked> ${escapeHTML(p)}</label>
      <button class="btn-del" onclick="deletePlayer(${idx})">×</button>
    `;
    container.appendChild(item);
  });
}

function addNewPlayer() {
  const input = document.getElementById("newPlayerInput");
  const name = input.value.trim();
  if (!name) return;
  if (!appState.masterPlayers.includes(name)) {
    appState.masterPlayers.push(name);
    syncToFirebase();
  }
  input.value = "";
}

function deletePlayer(index) {
  appState.masterPlayers.splice(index, 1);
  syncToFirebase();
}

function makeRandomTeams() {
  const checkboxes = document.querySelectorAll(".player-chk:checked");
  const selectedPlayers = Array.from(checkboxes).map(cb => cb.value);
  if (selectedPlayers.length < 2) {
    alert("2名以上チェックしてください。");
    return;
  }

  let shuffled = [...selectedPlayers].sort(() => Math.random() - 0.5);
  const half = Math.ceil(shuffled.length / 2);
  
  appState.team1Members = shuffled.slice(0, half);
  appState.team2Members = shuffled.slice(half);
  appState.team1Orders = create16OrdersEmpty();
  appState.team2Orders = create16OrdersEmpty();
  appState.isOrderSet = false;

  syncToFirebase();
}

function openOrderModal(teamKey) {
  if (currentRole === 'p1_only' && teamKey === '2') return;
  if (currentRole === 'p2_only' && teamKey === '1') return;

  currentModalTeam = teamKey;
  const members = (teamKey === '1') ? appState.team1Members : appState.team2Members;
  const orders = (teamKey === '1') ? appState.team1Orders : appState.team2Orders;

  if (!members || members.length === 0) {
    alert("先にチーム分けを行ってください。");
    return;
  }

  document.getElementById("modalTitle").textContent = `${teamKey === '1' ? '🔴 1Pチーム' : '🔵 2Pチーム'} オーダー設定 (16枠)`;
  renderModalRows(members, orders);
  document.getElementById("orderModal").style.display = "flex";
}

function renderModalRows(members, orders) {
  const container = document.getElementById("modalOrderRows");
  container.innerHTML = "";

  orders.forEach((slot, idx) => {
    const row = document.createElement("div");
    row.className = "order-row";

    let nameOptions = `<option value="">-- 選択 --</option>` + members.map(p => 
      `<option value="${escapeHTML(p)}" ${p === slot.name ? 'selected' : ''}>${escapeHTML(p)}</option>`
    ).join("");

    let charOptions = `<option value="">-- キャラ --</option>` + allCharacters.map(c => 
      `<option value="${c.id}" ${c.id === slot.charId ? 'selected' : ''}>${c.name}</option>`
    ).join("");

    row.innerHTML = `
      <span style="width:70px;"><b>${idx + 1}人目:</b></span>
      <select class="m-name" style="flex:1;">${nameOptions}</select>
      <select class="m-char" style="flex:1;">${charOptions}</select>
    `;
    container.appendChild(row);
  });
}

function saveAndShuffleModal() {
  const mode = document.querySelector('input[name="orderMode"]:checked').value;
  const orders = (currentModalTeam === '1') ? appState.team1Orders : appState.team2Orders;
  const rows = document.querySelectorAll("#modalOrderRows .order-row");

  let tempSelections = [];
  rows.forEach((row) => {
    tempSelections.push({
      name: row.querySelector(".m-name").value,
      charId: row.querySelector(".m-char").value
    });
  });

  if (mode === 'bossFixed') {
    let top15 = tempSelections.slice(0, 15).sort(() => Math.random() - 0.5);
    for (let i = 0; i < 15; i++) {
      orders[i].name = top15[i].name; orders[i].charId = top15[i].charId; orders[i].revealed = false;
    }
    orders[15].name = tempSelections[15].name; orders[15].charId = tempSelections[15].charId; orders[15].revealed = false;
  } else {
    tempSelections.sort(() => Math.random() - 0.5);
    for (let i = 0; i < 16; i++) {
      orders[i].name = tempSelections[i].name; orders[i].charId = tempSelections[i].charId; orders[i].revealed = false;
    }
  }

  appState.isOrderSet = true;
  closeOrderModal();
  syncToFirebase();
}

function saveOrderModal() {
  const orders = (currentModalTeam === '1') ? appState.team1Orders : appState.team2Orders;
  const rows = document.querySelectorAll("#modalOrderRows .order-row");

  rows.forEach((row, idx) => {
    orders[idx].name = row.querySelector(".m-name").value;
    orders[idx].charId = row.querySelector(".m-char").value;
    orders[idx].revealed = false;
  });

  appState.isOrderSet = true;
  closeOrderModal();
  syncToFirebase();
}

function closeOrderModal() {
  document.getElementById("orderModal").style.display = "none";
}

function handleImgError(img) {
  img.classList.add('load-error');
}

function renderDisplay() {
  renderTeamDisplay('1', appState.team1Members, appState.team1Orders);
  renderTeamDisplay('2', appState.team2Members, appState.team2Orders);
}

function renderTeamDisplay(teamKey, members, orders) {
  const container = document.getElementById(`team${teamKey}-display`);
  if (!container) return;
  container.innerHTML = "";

  if ((currentRole === 'p1_only' && teamKey === '2') || (currentRole === 'p2_only' && teamKey === '1')) {
    container.innerHTML = `<div style="padding:20px; text-align:center; color:#666;">（他チームの入力非表示中）</div>`;
    return;
  }

  // 2Pチームの場合は反転用クラスを追加
  const faceClass = (teamKey === '2') ? "char-face p2-face" : "char-face";

  if (!appState.isOrderSet) {
    if (members) {
      members.forEach((name, idx) => {
        const card = document.createElement("div");
        card.className = "player-card";
        card.innerHTML = `<span class="order-num">${idx + 1}.</span><div class="player-info"><div class="player-name">${escapeHTML(name)}</div></div>`;
        container.appendChild(card);
      });
    }
  } else {
    if (orders) {
      orders.forEach((slot, idx) => {
        const card = document.createElement("div");
        const charInfo = allCharacters.find(c => c.id === slot.charId) || { name: "未選択", icon: "" };
        card.className = `player-card ${slot.revealed ? '' : 'is-hidden'}`;
        
        if (slot.revealed) {
          card.innerHTML = `
            <span class="order-num">${idx + 1}.</span>
            <img class="${faceClass}" src="${charInfo.icon}" onerror="handleImgError(this)">
            <div class="player-info">
              <div class="player-name" title="${escapeHTML(slot.name)}">${slot.name ? escapeHTML(slot.name) : '未設定'}</div>
              <div class="char-name">${charInfo.name}</div>
            </div>
          `;
        } else {
          card.innerHTML = `
            <span class="order-num">${idx + 1}.</span>
            <img class="${faceClass}" src="image/secret.png" onerror="handleImgError(this)">
            <div class="player-info">
              <div class="player-name">？？？</div>
              <div class="char-name">（伏せ）</div>
            </div>
          `;
        }

        card.onclick = () => {
          slot.revealed = !slot.revealed;
          syncToFirebase();
        };

        container.appendChild(card);
      });
    }
  }
}

function escapeHTML(str) {
  if (!str) return "";
  return str.replace(/[&<>"']/g, function(m) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
  });
}
</script>
</body>
</html>
