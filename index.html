<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スパ2X 16キャラ戦 チーム管理＆OBSツール</title>
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
  :root {
    --bg-color: #0f0f13;
    --panel-bg: #1a1a24;
    --card-bg: #252533;
    --text-color: #ffffff;
    --1p-color: #8d0801;
    --2p-color: #1d3557;
  }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    margin: 0;
    padding: 10px;
  }

  h2, h3 { margin: 5px 0 10px 0; }

  .admin-panel {
    background: var(--panel-bg);
    border: 1px solid #333;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 20px;
  }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

  textarea, select, input[type="text"] {
    background: #101015;
    color: #fff;
    border: 1px solid #444;
    padding: 6px;
    border-radius: 4px;
    box-sizing: border-box;
  }

  .btn {
    background: #3a86ff;
    color: white;
    border: none;
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
  }
  .btn:hover { background: #2563eb; }
  .btn-danger { background: #d90429; }
  .btn-success { background: #38b000; }
  .btn-warning { background: #ff9f1c; color: #000; }
  .btn-purple { background: #8338ec; color: #fff; }
  .btn-purple:hover { background: #6c11d9; }

  .mode-select {
    background: #111118;
    padding: 8px;
    border-radius: 6px;
    margin-bottom: 8px;
    font-size: 0.9em;
  }

  .member-checklist {
    background: #101015;
    border: 1px solid #444;
    border-radius: 4px;
    padding: 8px;
    max-height: 140px;
    overflow-y: auto;
    margin-bottom: 8px;
  }

  .member-item {
    display: inline-flex;
    align-items: center;
    background: #20202c;
    border: 1px solid #333;
    padding: 3px 8px;
    border-radius: 4px;
    margin-right: 6px;
    margin-bottom: 6px;
  }

  .btn-del {
    background: transparent;
    color: #ff5555;
    border: none;
    font-weight: bold;
    cursor: pointer;
    font-size: 1.1em;
    padding: 0 2px;
  }

  /* 4列メインレイアウト */
  .obs-display {
    display: grid;
    grid-template-columns: 1fr 1.2fr 1.2fr 1fr;
    gap: 10px;
  }

  .team-column {
    background: var(--panel-bg);
    border-radius: 8px;
    padding: 8px;
    box-sizing: border-box;
    min-height: 400px;
  }

  .team-title {
    text-align: center;
    font-size: 1em;
    font-weight: bold;
    padding: 4px;
    border-radius: 4px;
    margin-bottom: 8px;
  }
  .p1-header { background: var(--1p-color); }
  .p2-header { background: var(--2p-color); }
  .bench-header { background: #333; color: #aaa; }

  .player-card {
    display: flex;
    align-items: center;
    background: var(--card-bg);
    margin-bottom: 4px;
    padding: 4px 6px;
    border-radius: 4px;
    gap: 6px;
    cursor: pointer;
    user-select: none;
    width: 100%;
    box-sizing: border-box;
    height: 42px;
    transition: transform 0.1s, background 0.1s;
  }
  .player-card:hover { background: #323246; transform: scale(1.01); }

  .order-num { font-weight: bold; width: 20px; color: #aaa; text-align: right; font-size: 0.9em; flex-shrink: 0; }
  
  .char-face { 
    width: 32px; 
    height: 32px; 
    object-fit: cover; 
    border-radius: 3px; 
    background: #000; 
    flex-shrink: 0;
  }
  .p2-face {
    transform: scaleX(-1);
  }
  .char-face.load-error { display: none; }

  .player-info { flex: 1; overflow: hidden; min-width: 0; }
  .player-name { 
    font-size: 0.9em; 
    font-weight: bold; 
    white-space: nowrap; 
    overflow: hidden; 
    text-overflow: ellipsis; 
  }
  .char-name { font-size: 0.7em; color: #bbb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .is-hidden .player-name { color: #666; }
  .is-hidden .char-name { color: #444; }

  .modal {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.8);
    justify-content: center;
    align-items: center;
    z-index: 100;
  }
  .modal-content {
    background: var(--panel-bg);
    padding: 20px;
    border-radius: 8px;
    max-width: 800px;
    width: 90%;
    max-height: 85vh;
    overflow-y: auto;
  }

  .order-row {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 6px;
  }
</style>
</head>
<body>

  <div class="admin-panel">
    <details open>
      <summary>⚙️ 管理操作パネル</summary>
      <div style="margin-top: 10px;">
        
        <div class="mode-select" style="background:#20202d; margin-bottom:12px;">
          <b>📱 端末別入力モード設定:</b><br>
          <label><input type="radio" name="deviceRole" value="pc_all" checked onclick="setDeviceRole('pc_all')"> 💻 PC1台で両チーム分を入力する</label><br>
          <label><input type="radio" name="deviceRole" value="p1_only" onclick="setDeviceRole('p1_only')"> 🔴 この端末は 1Pチームのみ 操作＆閲覧</label><br>
          <label><input type="radio" name="deviceRole" value="p2_only" onclick="setDeviceRole('p2_only')"> 🔵 この端末は 2Pチームのみ 操作＆閲覧</label>
        </div>

        <div class="grid-2">
          <div>
            <h3>1. プレイヤー選択（本日の参加者）</h3>
            <div id="masterChecklist" class="member-checklist"></div>
            
            <div style="display:flex; gap:5px; margin-bottom:10px;">
              <input type="text" id="newPlayerInput" placeholder="新しいプレイヤー名を追加" style="flex:1;">
              <button class="btn" onclick="addNewPlayer()">名簿に追加</button>
            </div>

            <button class="btn btn-success" style="width:100%;" onclick="makeRandomTeams()">チェックした人を1P / 2Pチームに自動振り分け</button>
          </div>

          <div>
            <h3>2. オーダー＆キャラ設定 (16枠)</h3>
            <div class="mode-select">
              <label><input type="radio" name="orderMode" value="manual" checked onclick="updateModalLabels()"> 手動設定（完全自由）</label><br>
              <label><input type="radio" name="orderMode" value="bossFixed" onclick="updateModalLabels()"> 1〜15人目シャッフル ＋ 大将(16人目)固定</label><br>
              <label><input type="radio" name="orderMode" value="counterPick" onclick="updateModalLabels()"> 先鋒申告 ＋ 2〜16人目被せ</label>
            </div>
            <div style="display:flex; flex-direction:column; gap:10px;">
              <button id="btnOpenP1" class="btn btn-success" onclick="openOrderModal('1')">🔴 1Pチーム オーダー設定</button>
              <button id="btnOpenP2" class="btn btn-success" onclick="openOrderModal('2')">🔵 2Pチーム オーダー設定</button>
            </div>
          </div>
        </div>

      </div>
    </details>
  </div>

  <!-- 4列レイアウト（①1P待機 / ②1P対戦 / ③2P対戦 / ④2P待機） -->
  <div class="obs-display">
    <div class="team-column">
      <div class="team-title bench-header">1P 待機 (ベンチ)</div>
      <div id="team1-bench-display"></div>
    </div>

    <div class="team-column">
      <div class="team-title p1-header">1P TEAM (対戦枠)</div>
      <div id="team1-match-display"></div>
    </div>

    <div class="team-column">
      <div class="team-title p2-header">2P TEAM (対戦枠)</div>
      <div id="team2-match-display"></div>
    </div>

    <div class="team-column">
      <div class="team-title bench-header">2P 待機 (ベンチ)</div>
      <div id="team2-bench-display"></div>
    </div>
  </div>

  <div id="orderModal" class="modal">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:8px;">
        <h3 id="modalTitle" style="margin:0;">オーダー設定 (16枠)</h3>
        <button class="btn btn-purple" onclick="fillFullRandomModal()">🎲 プレイヤー・キャラ・順番を完全全ランダム設定</button>
      </div>
      <div id="modalOrderRows"></div>
      <br>
      <div style="display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap;">
        <button class="btn btn-warning" onclick="saveAndShuffleModal()">🔀 完了して裏でランダムシャッフル</button>
        <button class="btn btn-success" onclick="saveOrderModal()">そのまま設定完了</button>
        <button class="btn btn-danger" onclick="closeOrderModal()">キャンセル</button>
      </div>
    </div>
  </div>

<script>
// --- Firebase初期設定 ---
const firebaseConfig = {
  apiKey: "AIzaSyDMgiXpRGBLJofwxWEh0pG5b3FQ7yZNLK8",
  authDomain: "sf2x-app.firebaseapp.com",
  projectId: "sf2x-app",
  storageBucket: "sf2x-app.firebasestorage.app",
  messagingSenderId: "447610198262",
  appId: "1:447610198262:web:1a9576f2d6696518caf4d7",
  measurementId: "G-141DL20YTK"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const baseChars = ["リュウ","ケン","本田","春麗","ブランカ","ザンギエフ","ガイル","ダルシム","ホーク","キャミィ","フェイロン","ディージェイ","バイソン","バルログ","サガット","ベガ"];
const allCharacters = baseChars.map((name, i) => ({
  id: `x_${i}`, name: `X ${name}`, icon: `image/x_${i}.png`
}));

let appState = {
  masterPlayers: ["ウメハラ", "ヌキ", "ハイタニ", "サコー", "ナカム～", "ぐっち", "こたか", "サシシ"],
  team1Members: [],
  team2Members: [],
  team1Orders: { match: [], bench: [] },
  team2Orders: { match: [], bench: [] },
  isOrderSet: false
};

let currentRole = 'pc_all';
let currentModalTeam = '1';

window.onload = function() {
  db.ref('sf2x_state').on('value', (snapshot) => {
    const data = snapshot.val();
    if (data) {
      appState = data;
      if (Array.isArray(appState.team1Orders)) {
        appState.team1Orders = { match: appState.team1Orders, bench: [] };
      }
      if (Array.isArray(appState.team2Orders)) {
        appState.team2Orders = { match: appState.team2Orders, bench: [] };
      }
      renderMasterChecklist();
      renderDisplay();
    } else {
      syncToFirebase();
    }
  });
};

function syncToFirebase() {
  db.ref('sf2x_state').set(appState);
}

function setDeviceRole(role) {
  currentRole = role;
  const btnP1 = document.getElementById("btnOpenP1");
  const btnP2 = document.getElementById("btnOpenP2");

  if (role === 'p1_only') {
    btnP1.style.display = "block";
    btnP2.style.display = "none";
  } else if (role === 'p2_only') {
    btnP1.style.display = "none";
    btnP2.style.display = "block";
  } else {
    btnP1.style.display = "block";
    btnP2.style.display = "block";
  }
  renderDisplay();
}

function create16OrdersEmpty() {
  let orders = [];
  for (let i = 0; i < 16; i++) {
    orders.push({ name: "", charId: "", revealed: false });
  }
  return { match: orders, bench: [] };
}

function renderMasterChecklist() {
  const container = document.getElementById("masterChecklist");
  if (!container) return;
  container.innerHTML = "";
  if (!appState.masterPlayers) appState.masterPlayers = [];
  
  appState.masterPlayers.forEach((p, idx) => {
    const item = document.createElement("div");
    item.className = "member-item";
    item.innerHTML = `
      <label><input type="checkbox" class="player-chk" value="${escapeHTML(p)}" checked> ${escapeHTML(p)}</label>
      <button class="btn-del" onclick="deletePlayer(${idx})">×</button>
    `;
    container.appendChild(item);
  });
}

function addNewPlayer() {
  const input = document.getElementById("newPlayerInput");
  const name = input.value.trim();
  if (!name) return;
  if (!appState.masterPlayers.includes(name)) {
    appState.masterPlayers.push(name);
    syncToFirebase();
  }
  input.value = "";
}

function deletePlayer(index) {
  appState.masterPlayers.splice(index, 1);
  syncToFirebase();
}

function makeRandomTeams() {
  const checkboxes = document.querySelectorAll(".player-chk:checked");
  const selectedPlayers = Array.from(checkboxes).map(cb => cb.value);
  if (selectedPlayers.length < 2) {
    alert("2名以上チェックしてください。");
    return;
  }

  let shuffled = [...selectedPlayers].sort(() => Math.random() - 0.5);
  const half = Math.ceil(shuffled.length / 2);
  
  appState.team1Members = shuffled.slice(0, half);
  appState.team2Members = shuffled.slice(half);
  appState.team1Orders = create16OrdersEmpty();
  appState.team2Orders = create16OrdersEmpty();
  appState.isOrderSet = false;

  syncToFirebase();
}

function openOrderModal(teamKey) {
  if (currentRole === 'p1_only' && teamKey === '2') return;
  if (currentRole === 'p2_only' && teamKey === '1') return;

  currentModalTeam = teamKey;
  const members = (teamKey === '1') ? appState.team1Members : appState.team2Members;
  const ordersObj = (teamKey === '1') ? appState.team1Orders : appState.team2Orders;
  
  const current16 = [...(ordersObj.match || []), ...(ordersObj.bench || [])];
  while (current16.length < 16) {
    current16.push({ name: "", charId: "", revealed: false });
  }

  if (!members || members.length === 0) {
    alert("先にチーム分けを行ってください。");
    return;
  }

  document.getElementById("modalTitle").textContent = `${teamKey === '1' ? '🔴 1Pチーム' : '🔵 2Pチーム'} オーダー設定 (16枠)`;
  renderModalRows(members, current16);
  updateModalLabels();
  document.getElementById("orderModal").style.display = "flex";
}

function renderModalRows(members, orders) {
  const container = document.getElementById("modalOrderRows");
  container.innerHTML = "";

  orders.forEach((slot, idx) => {
    const row = document.createElement("div");
    row.className = "order-row";

    let nameOptions = `<option value="">-- 選択 --</option>` + members.map(p => 
      `<option value="${escapeHTML(p)}" ${p === slot.name ? 'selected' : ''}>${escapeHTML(p)}</option>`
    ).join("");

    let charOptions = `<option value="">-- キャラ --</option>` + allCharacters.map(c => 
      `<option value="${c.id}" ${c.id === slot.charId ? 'selected' : ''}>${c.name}</option>`
    ).join("");

    row.innerHTML = `
      <span class="slot-label" style="width:140px;"><b>${idx + 1}人目:</b></span>
      <select class="m-name" style="flex:1;">${nameOptions}</select>
      <select class="m-char" style="flex:1;">${charOptions}</select>
    `;
    container.appendChild(row);
  });
}

function updateModalLabels() {
  const modeElement = document.querySelector('input[name="orderMode"]:checked');
  if (!modeElement) return;
  const mode = modeElement.value;
  const labels = document.querySelectorAll(".slot-label");

  labels.forEach((label, idx) => {
    if (mode === 'counterPick' && idx === 0) {
      label.innerHTML = `<b>1人目 <span style="color:#ff9f1c;">(先鋒申告)</span>:</b>`;
    } else if (mode === 'bossFixed' && idx === 15) {
      label.innerHTML = `<b>16人目 <span style="color:#ff9f1c;">(大将固定)</span>:</b>`;
    } else {
      label.innerHTML = `<b>${idx + 1}人目:</b>`;
    }
  });
}

// 🎲 完全全ランダム自動割り当て機能 (キャラ16種完全被りなし修正版)
function fillFullRandomModal() {
  const members = (currentModalTeam === '1') ? appState.team1Members : appState.team2Members;
  if (!members || members.length === 0) return;

  const rows = document.querySelectorAll("#modalOrderRows .order-row");
  
  // 1. プレイヤー（人数不足分は重複して16枠を埋める）
  let playerPool = [];
  while (playerPool.length < 16) {
    let shuffledMembers = [...members].sort(() => Math.random() - 0.5);
    playerPool = playerPool.concat(shuffledMembers);
  }
  playerPool = playerPool.slice(0, 16);

  // 2. キャラクター（全16キャラを重複なしでランダムシャッフル）
  let shuffledChars = [...allCharacters].sort(() => Math.random() - 0.5);

  rows.forEach((row, idx) => {
    const nameSelect = row.querySelector(".m-name");
    const charSelect = row.querySelector(".m-char");

    nameSelect.value = playerPool[idx];
    charSelect.value = shuffledChars[idx].id; // 被りなしで割当
  });
}

function saveAndShuffleModal() {
  const mode = document.querySelector('input[name="orderMode"]:checked').value;
  const targetOrders = (currentModalTeam === '1') ? appState.team1Orders : appState.team2Orders;
  const rows = document.querySelectorAll("#modalOrderRows .order-row");

  let tempSelections = [];
  rows.forEach((row) => {
    tempSelections.push({
      name: row.querySelector(".m-name").value,
      charId: row.querySelector(".m-char").value,
      revealed: false
    });
  });

  if (mode === 'counterPick') {
    tempSelections[0].revealed = false;
    targetOrders.match = [tempSelections[0]];
    targetOrders.bench = tempSelections.slice(1);
  } else if (mode === 'bossFixed') {
    let top15 = tempSelections.slice(0, 15).sort(() => Math.random() - 0.5);
    let final16 = [...top15, tempSelections[15]];
    targetOrders.match = final16;
    targetOrders.bench = [];
  } else {
    tempSelections.sort(() => Math.random() - 0.5);
    targetOrders.match = tempSelections;
    targetOrders.bench = [];
  }

  appState.isOrderSet = true;
  closeOrderModal();
  syncToFirebase();
}

function saveOrderModal() {
  const mode = document.querySelector('input[name="orderMode"]:checked').value;
  const targetOrders = (currentModalTeam === '1') ? appState.team1Orders : appState.team2Orders;
  const rows = document.querySelectorAll("#modalOrderRows .order-row");

  let tempSelections = [];
  rows.forEach((row) => {
    tempSelections.push({
      name: row.querySelector(".m-name").value,
      charId: row.querySelector(".m-char").value,
      revealed: false
    });
  });

  if (mode === 'counterPick') {
    targetOrders.match = [tempSelections[0]];
    targetOrders.bench = tempSelections.slice(1);
  } else {
    targetOrders.match = tempSelections;
    targetOrders.bench = [];
  }

  appState.isOrderSet = true;
  closeOrderModal();
  syncToFirebase();
}

function closeOrderModal() {
  document.getElementById("orderModal").style.display = "none";
}

function handleImgError(img) {
  img.classList.add('load-error');
}

function moveBenchToMatch(teamKey, benchIndex) {
  const targetOrders = (teamKey === '1') ? appState.team1Orders : appState.team2Orders;
  if (!targetOrders.bench || !targetOrders.bench[benchIndex]) return;

  const movedChar = targetOrders.bench.splice(benchIndex, 1)[0];
  movedChar.revealed = true;
  targetOrders.match.push(movedChar);

  syncToFirebase();
}

function renderDisplay() {
  renderTeamDisplay('1', appState.team1Members, appState.team1Orders);
  renderTeamDisplay('2', appState.team2Members, appState.team2Orders);
}

function renderTeamDisplay(teamKey, members, ordersObj) {
  const matchContainer = document.getElementById(`team${teamKey}-match-display`);
  const benchContainer = document.getElementById(`team${teamKey}-bench-display`);
  if (!matchContainer || !benchContainer) return;

  matchContainer.innerHTML = "";
  benchContainer.innerHTML = "";

  if ((currentRole === 'p1_only' && teamKey === '2') || (currentRole === 'p2_only' && teamKey === '1')) {
    matchContainer.innerHTML = `<div style="padding:20px; text-align:center; color:#666;">（非表示）</div>`;
    benchContainer.innerHTML = `<div style="padding:20px; text-align:center; color:#666;">（非表示）</div>`;
    return;
  }

  const faceClass = (teamKey === '2') ? "char-face p2-face" : "char-face";

  if (!appState.isOrderSet) {
    if (members) {
      members.forEach((name, idx) => {
        const card = document.createElement("div");
        card.className = "player-card";
        card.innerHTML = `<span class="order-num">${idx + 1}.</span><div class="player-info"><div class="player-name">${escapeHTML(name)}</div></div>`;
        matchContainer.appendChild(card);
      });
    }
  } else {
    if (ordersObj.match) {
      ordersObj.match.forEach((slot, idx) => {
        const card = document.createElement("div");
        const charInfo = allCharacters.find(c => c.id === slot.charId) || { name: "未選択", icon: "" };
        card.className = `player-card ${slot.revealed ? '' : 'is-hidden'}`;
        
        if (slot.revealed) {
          card.innerHTML = `
            <span class="order-num">${idx + 1}.</span>
            <img class="${faceClass}" src="${charInfo.icon}" onerror="handleImgError(this)">
            <div class="player-info">
              <div class="player-name" title="${escapeHTML(slot.name)}">${slot.name ? escapeHTML(slot.name) : '未設定'}</div>
              <div class="char-name">${charInfo.name}</div>
            </div>
          `;
        } else {
          card.innerHTML = `
            <span class="order-num">${idx + 1}.</span>
            <img class="${faceClass}" src="image/secret.png" onerror="handleImgError(this)">
            <div class="player-info">
              <div class="player-name">？？？</div>
              <div class="char-name">（伏せ）</div>
            </div>
          `;
        }

        card.onclick = () => {
          slot.revealed = !slot.revealed;
          syncToFirebase();
        };

        matchContainer.appendChild(card);
      });
    }

    if (ordersObj.bench) {
      ordersObj.bench.forEach((slot, idx) => {
        const card = document.createElement("div");
        const charInfo = allCharacters.find(c => c.id === slot.charId) || { name: "未選択", icon: "" };
        card.className = "player-card";
        
        card.innerHTML = `
          <img class="${faceClass}" src="${charInfo.icon}" onerror="handleImgError(this)">
          <div class="player-info">
            <div class="player-name" title="${escapeHTML(slot.name)}">${slot.name ? escapeHTML(slot.name) : '未設定'}</div>
            <div class="char-name">${charInfo.name}</div>
          </div>
        `;

        card.onclick = () => {
          moveBenchToMatch(teamKey, idx);
        };

        benchContainer.appendChild(card);
      });
    }
  }
}

function escapeHTML(str) {
  if (!str) return "";
  return str.replace(/[&<>"']/g, function(m) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
  });
}
</script>
</body>
</html>
